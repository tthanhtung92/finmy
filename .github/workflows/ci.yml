name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Local-manifest tools: dotnet-ef isn't used in CI directly, but dotnet
      # dotnet-coverage inside scripts/coverage.ps1 needs the manifest restored.
      - run: dotnet tool restore

      - run: dotnet restore Finmy.slnx

      # TreatWarningsAsErrors + AnalysisMode=Recommended (Directory.Build.props)
      # make this the analyzer gate, not just a compile check.
      - run: dotnet build Finmy.slnx -c Release --no-restore

      - name: Check for vulnerable packages
        run: |
          dotnet list Finmy.slnx package --vulnerable --format json > vulnerable.json
          if grep -q '"vulnerabilities"' vulnerable.json; then
            echo "::error::Vulnerable NuGet packages found:"
            cat vulnerable.json
            exit 1
          fi
          echo "No vulnerable packages found."

      # Reflects over the production assemblies without executing them, so it
      # runs apart from coverage.ps1 rather than dragging the number down.
      - run: dotnet test tests/Finmy.ArchitectureTests/Finmy.ArchitectureTests.csproj -c Release --no-restore

      # Runs unit and integration (Testcontainers: Postgres, Redis, MinIO --
      # ubuntu-latest ships a working Docker daemon already) and gates on the
      # 52% line / 48% branch floor.
      - shell: pwsh
        run: ./scripts/coverage.ps1

  # No .NET here. This is the only place the Helm chart and Terraform get
  # checked at all: no helm, kubectl, terraform, sops or age binary is assumed
  # to exist on a dev machine (see deploy/README.md).
  chart-and-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - run: helm lint deploy/helm/finmy

      - name: Render the chart with placeholder secrets
        run: |
          helm template finmy deploy/helm/finmy \
            --set image.tag=ci \
            --set secrets.jwtSigningKey=ci-placeholder-key-at-least-32-bytes-long \
            --set secrets.postgresPassword=ci-placeholder \
            --set secrets.minioRootUser=ci-placeholder \
            --set secrets.minioRootPassword=ci-placeholder \
            > rendered.yaml

      - name: Validate rendered manifests against Kubernetes schemas
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary rendered.yaml

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform -chdir=deploy/terraform fmt -check -recursive
      - run: terraform -chdir=deploy/terraform init -backend=false
      - run: terraform -chdir=deploy/terraform validate

      # deploy/values-prod.sops.yaml must never land in the repo as plaintext.
      - name: Confirm the committed secrets file is actually encrypted
        run: grep -q 'ENC\[' deploy/values-prod.sops.yaml
