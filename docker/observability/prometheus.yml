# Single scrape target: the collector's own Prometheus exporter, which re-exposes whatever
# metrics arrived over OTLP from the app. Prometheus never talks to the app directly, so there
# is no new HTTP route on the app to add to the AllowAnonymous/DisableRateLimiting allowlist.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
