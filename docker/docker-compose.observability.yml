name: finmy

# Opt-in observability stack, additive to docker-compose.yml rather than an override layer:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.observability.yml up -d
# Both files declare `name: finmy` and neither declares a custom network, so they land on the
# same default `finmy_default` network and this merges into one project. Running
# docker-compose.yml alone is unaffected: the `api` fragment below only adds environment keys
# to the service the base file already defines.

volumes:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/otel-collector.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/otel-collector.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.7.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: alertingSimplifiedRouting
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

  # Merges into the `api` service docker-compose.yml already defines: same image, same other
  # settings, one more environment key pointing it at the collector over OTLP/gRPC.
  api:
    environment:
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
