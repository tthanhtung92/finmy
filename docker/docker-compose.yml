name: finmy

# Local development defaults live inline below, so `docker compose up` with no
# .env at all still brings up a working system (ROADMAP.md section 6, item 1).
# Override any of them with `docker compose --env-file .env ...`.
# The Jwt signing key here is for local development only; Phase 5 owns real
# secret management (see TECH-DEBT.md).
x-db-connection: &db-connection "Host=postgres;Port=5432;Database=${POSTGRES_DB:-finmy_db};Username=${POSTGRES_USER:-finmy};Password=${POSTGRES_PASSWORD:-finmy}"

volumes:
  pgdata:
  redisdata:
  minio_data:

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finmy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finmy}
      POSTGRES_DB: ${POSTGRES_DB:-finmy_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finmy} -d ${POSTGRES_DB:-finmy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-finmy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-finmy-minio-secret}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies EF migrations for the three modules, then exits. `api`
  # waits on it completing successfully. This is the smallest thing that
  # satisfies "docker compose up, no manual steps" without prejudging Phase
  # 3's real multi-replica migration strategy (see TECH-DEBT.md).
  migrate:
    build:
      context: ..
      target: migrator
    environment:
      ConnectionStrings__IdentityDb: *db-connection
      ConnectionStrings__BudgetingDb: *db-connection
      ConnectionStrings__LedgerDb: *db-connection
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      target: final
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__IdentityDb: *db-connection
      ConnectionStrings__BudgetingDb: *db-connection
      ConnectionStrings__LedgerDb: *db-connection
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-finmy-local-development-signing-key-32-bytes}
      Storage__Endpoint: http://minio:9000
      Storage__Bucket: receipts
      Storage__AccessKey: ${MINIO_ROOT_USER:-finmy}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-finmy-minio-secret}
      IdentitySeed__IsSeedAdmin: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
