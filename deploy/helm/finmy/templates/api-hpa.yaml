# Works out of the box on k3s: metrics-server ships bundled, and the
# Deployment sets CPU requests, which the HPA needs to compute utilization.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finmy-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finmy-api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.targetCPUUtilizationPercentage }}
