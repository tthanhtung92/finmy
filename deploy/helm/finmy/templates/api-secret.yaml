# Consumed by every workload in this chart via envFrom.secretRef, so a new env
# var only needs adding here, not wiring into each Deployment/StatefulSet too.
# Values come from deploy/values-prod.sops.yaml at deploy time; values.yaml
# only ships empty placeholders so `helm template`/`helm lint` render in CI
# with no decryption step.
apiVersion: v1
kind: Secret
metadata:
  name: finmy-secrets
type: Opaque
stringData:
  ConnectionStrings__IdentityDb: &db-connection-string "Host=finmy-postgres;Port=5432;Database={{ .Values.postgres.database }};Username={{ .Values.postgres.user }};Password={{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword }}"
  ConnectionStrings__BudgetingDb: *db-connection-string
  ConnectionStrings__LedgerDb: *db-connection-string
  ConnectionStrings__Redis: "finmy-redis:6379"
  Jwt__SigningKey: {{ required "secrets.jwtSigningKey is required" .Values.secrets.jwtSigningKey | quote }}
  Storage__Endpoint: "http://finmy-minio:9000"
  Storage__Bucket: {{ .Values.minio.bucket | quote }}
  Storage__AccessKey: {{ required "secrets.minioRootUser is required" .Values.secrets.minioRootUser | quote }}
  Storage__SecretKey: {{ required "secrets.minioRootPassword is required" .Values.secrets.minioRootPassword | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}
