<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <title>Envelope Live Demo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #171a21;
            --border: #2a2e38;
            --text: #e6e8eb;
            --muted: #8b93a1;
            --accent: #5b8cff;
            --ok: #3ecf8e;
            --warn: #f5a524;
            --danger: #f2545b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
        }

        h1 {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 4px;
        }

        .sub {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 20px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
        }

        .status.connected .dot {
            background: var(--ok);
        }

        .status.connecting .dot {
            background: var(--warn);
        }

        .status.disconnected .dot {
            background: var(--danger);
        }

        .row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input[type=text] {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            flex: 1;
            max-width: 220px;
        }

        button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
        }

            button:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

        .panels {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 16px;
            align-items: start;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
        }

            .panel h2 {
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: .05em;
                color: var(--muted);
                margin: 0 0 12px;
            }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            text-align: left;
            padding: 6px 4px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--muted);
            font-weight: 500;
            font-size: 11px;
            text-transform: uppercase;
        }

        tr.deleted {
            opacity: 0.4;
            text-decoration: line-through;
        }

        .empty {
            color: var(--muted);
            font-size: 12px;
            padding: 8px 0;
        }

        #log {
            font-size: 12px;
            max-height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
        }

        .log-entry {
            padding: 4px 0;
            border-bottom: 1px dashed var(--border);
            color: var(--muted);
        }

            .log-entry .tag {
                color: var(--accent);
            }

            .log-entry.del .tag {
                color: var(--danger);
            }

            .log-entry.warn .tag {
                color: var(--warn);
            }

            .log-entry.danger .tag {
                color: var(--danger);
            }
    </style>
</head>
<body>
    <h1>Envelope Live Demo</h1>
    <div class="sub">Live envelope state over SignalR</div>

    <div id="statusBadge" class="status disconnected">
        <span class="dot"></span>
        <span id="statusText">Not connected</span>
    </div>

    <div class="row">
        <input type="text" id="envelopeInput" placeholder="Envelope ID" />
        <button id="watchBtn">Watch envelope</button>
    </div>

    <div class="panels">
        <div class="panel">
            <h2>Watched envelopes</h2>
            <table>
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Allocated</th><th>Spent</th><th>Remaining</th><th></th></tr>
                </thead>
                <tbody id="envelopeBody"></tbody>
            </table>
            <div id="emptyState" class="empty">No envelopes watched yet.</div>
        </div>

        <div class="panel">
            <h2>Event log</h2>
            <div id="log"></div>
        </div>
    </div>

    <script>
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/hubs/envelopes")
            .withAutomaticReconnect()
            .build();

        // id -> { id, name, allocated, deleted }
        const envelopes = new Map();
        // ids we've asked the hub to watch, so we can re-subscribe after a reconnect
        const watchedIds = new Set();

        const statusBadge = document.getElementById("statusBadge");
        const statusText = document.getElementById("statusText");
        const envelopeBody = document.getElementById("envelopeBody");
        const emptyState = document.getElementById("emptyState");
        const log = document.getElementById("log");
        const envelopeInput = document.getElementById("envelopeInput");
        const watchBtn = document.getElementById("watchBtn");

        function setStatus(state, label) {
            statusBadge.className = "status " + state;
            statusText.textContent = label;
        }

        function addLog(tag, message, variant) {
            const entry = document.createElement("div");
            // Backwards compatible: addLog(tag, message, true) still means the "del" variant
            const variantClass = variant === true ? "del" : (variant || "");
            entry.className = "log-entry" + (variantClass ? " " + variantClass : "");
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="tag">[${tag}]</span> ${time} — ${message}`;
            log.appendChild(entry);
        }

        function render() {
            envelopeBody.innerHTML = "";
            if (envelopes.size === 0) {
                emptyState.style.display = "block";
                return;
            }
            emptyState.style.display = "none";
            for (const state of envelopes.values()) {
                const tr = document.createElement("tr");
                if (state.deleted) tr.classList.add("deleted");
                tr.innerHTML = `
                            <td>${state.id}</td>
                            <td>${state.name ?? ""}</td>
                            <td>${state.allocated ?? ""}</td>
                            <td>${state.spent ?? ""}</td>
                            <td>${state.remaining ?? ""}</td>
                            <td>${state.deleted ? "deleted" : ""}</td>
                        `;
                envelopeBody.appendChild(tr);
            }
        }

        connection.on("EnvelopeUpdated", (state) => {
            // ve lai: state.id, state.name, state.allocated
            const existing = envelopes.get(state.id) || {};
            envelopes.set(state.id, { ...existing, ...state, deleted: false });
            addLog("EnvelopeUpdated", `#${state.id} "${state.name}" remaining: ${state.remaining}`);
            render();
        });

        connection.on("EnvelopeDeleted", (id) => {
            // danh dau envelope id da bi xoa
            const existing = envelopes.get(id);
            if (existing) {
                existing.deleted = true;
            } else {
                envelopes.set(id, { id, deleted: true });
            }
            watchedIds.delete(id);
            addLog("EnvelopeDeleted", `#${id} was deleted`, true);
            render();
        });

        connection.on("EnvelopeAlert", (alert) => {
            // alert.level: 0 = running low, 1 = overspent
            const isExceeded = alert.level === 1;
            const levelText = isExceeded ? "OVER BUDGET" : "RUNNING LOW";
            const variant = isExceeded ? "danger" : "warn";
            const attemptedText = alert.attemptedAmount != null
                ? ` (attempted amount: ${alert.attemptedAmount})`
                : "";
            addLog(
                "EnvelopeAlert",
                `#${alert.id} ${levelText} remaining: ${alert.remaining} / spent: ${alert.spent} / allocated: ${alert.allocated}${attemptedText}`,
                variant
            );
        });

        connection.onreconnecting(() => {
            setStatus("connecting", "Reconnecting...");
        });

        connection.onreconnected(async () => {
            setStatus("connected", "Connected");
            addLog("SignalR", "Reconnected, re-subscribing to watched envelopes");
            for (const id of watchedIds) {
                try {
                    await connection.invoke("WatchEnvelope", id);
                } catch (err) {
                    addLog("Error", `Could not re-watch #${id}: ${err}`);
                }
            }
        });

        connection.onclose(() => {
            setStatus("disconnected", "Disconnected");
        });

        async function ensureStarted() {
            if (connection.state === signalR.HubConnectionState.Disconnected) {
                setStatus("connecting", "Connecting...");
                await connection.start();
                setStatus("connected", "Connected");
                addLog("SignalR", "Connected");
            }
        }

        async function watch(envelopeId) {
            await ensureStarted();
            await connection.invoke("WatchEnvelope", envelopeId);
            watchedIds.add(envelopeId);
            addLog("SignalR", `Now watching envelope #${envelopeId}`);
        }

        watchBtn.addEventListener("click", async () => {
            const raw = envelopeInput.value.trim();
            if (!raw) return;
            const envelopeId = isNaN(Number(raw)) ? raw : Number(raw);
            watchBtn.disabled = true;
            try {
                await watch(envelopeId);
                envelopeInput.value = "";
            } catch (err) {
                addLog("Error", `Could not watch #${envelopeId}: ${err}`);
            } finally {
                watchBtn.disabled = false;
            }
        });

        envelopeInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") watchBtn.click();
        });
    </script>
</body>
</html>
